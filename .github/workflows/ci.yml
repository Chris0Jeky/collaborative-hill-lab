name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline verification (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ["3.12"]
    env:
      CHL_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: Agg
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout identity
        run: |
          test "$(git rev-parse HEAD)" = "$CHL_EXPECTED_SHA"
          printf 'Verified commit: `%s`\n' "$CHL_EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            pyproject.toml

      - name: Install the committed dependency lock
        run: make setup PYTHON=python

      - name: Lint, type-check, and run unit and property tests
        run: make check

      - name: Run the complete test suite
        run: make test

      - name: Validate shipped study definitions
        run: make validate

      - name: Run offline acceptance scenarios
        run: make acceptance

      - name: Exercise the inspector in Chrome
        if: runner.os == 'Linux'
        run: make check-lab-browser

      - name: Retain browser review artifacts
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/browser-smoke/*.html
            artifacts/browser-smoke/*.png
            artifacts/browser-smoke/*.txt
            artifacts/browser-smoke/RESULTS.json
            artifacts/comparison-browser/*.html
            artifacts/comparison-browser/*.png
            artifacts/comparison-browser/*.txt
            artifacts/comparison-browser/RESULTS.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify the incentive atlas
        run: make check-atlas

      - name: Verify Study 002 inputs and exact benchmark
        run: make check-study002

      - name: Verify responsive Evidence Commons experiment
        run: make check-responsive

      - name: Verify quality safeguards experiment
        run: make check-quality-safeguards

      - name: Verify graph topology inputs and exact controls
        run: make check-graph

      - name: Verify exact labeled-state sparse pTFT
        run: make check-sparse-ptft

      - name: Verify exact noisy-corpus expectations and audit contract
        run: make check-noisy-corpus

      - name: Verify skeptical EC component ablations and controls
        run: make check-ec-rule-ablation

      - name: Verify opt-in audit feedback and exact expectation controls
        run: make check-audit-feedback

      - name: Verify the tested commit and clean workspace
        run: |
          test "$(git rev-parse HEAD)" = "$CHL_EXPECTED_SHA"
          if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
            git status --short
            echo "::error::Verification changed tracked files or left unexpected output."
            exit 1
          fi

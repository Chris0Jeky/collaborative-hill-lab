name: Counterfactual verification (temporary branch)
on:
  push:
    branches: ['verify/counterfactual-20261022']
permissions:
  contents: read
concurrency:
  group: counterfactual-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Record exact source
        run: |
          git rev-parse HEAD
          git rev-parse HEAD:src
          git rev-parse HEAD:tests
      - name: Install committed lock
        run: make setup PYTHON=python
      - name: Repository gates
        run: make check test validate
      - name: Acceptance
        run: .venv/bin/python scripts/acceptance.py
